<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#030303" />
    </radialGradient>

    <!-- Animated Shimmer Gold & Violet Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAFAFA">
        <animate attributeName="stop-color" values="#FAFAFA;#D4A843;#818CF8;#FAFAFA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#D4A843">
        <animate attributeName="stop-color" values="#D4A843;#818CF8;#FAFAFA;#D4A843" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#FAFAFA;#D4A843;#818CF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FAFAFA">
        <animate attributeName="stop-color" values="#FAFAFA;#D4A843;#818CF8;#FAFAFA" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .corner-bracket { stroke: #D4A843; stroke-width: 2; fill: none; opacity: 0.7; }
    
    .aperture-ring {
      transform-origin: 500px 75px;
      animation: rotateRing 18s linear infinite;
    }
    
    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Sora", "Plus Jakarta Sans", "Segoe UI", sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 0.28em;
      text-anchor: middle;
      fill: url(#shimmerGrad);
      filter: url(#glow);
    }

    .subtitle {
      font-family: "Space Mono", -apple-system, monospace;
      font-size: 13px;
      letter-spacing: 0.35em;
      text-anchor: middle;
      fill: #94A3B8;
      text-transform: uppercase;
    }

    .creator-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-anchor: middle;
      fill: #E2E8F0;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.5; filter: drop-shadow(0 0 6px rgba(212, 168, 67, 0.4)); }
      100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(129, 140, 248, 0.8)); }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1000" height="280" rx="16" class="bg" stroke="#1E293B" stroke-width="1.5" />

  <!-- Camera Viewfinder Corner Framing Brackets -->
  <path d="M 40 50 L 40 30 L 60 30" class="corner-bracket" />
  <path d="M 960 50 L 960 30 L 940 30" class="corner-bracket" />
  <path d="M 40 230 L 40 250 L 60 250" class="corner-bracket" />
  <path d="M 960 230 L 960 250 L 940 250" class="corner-bracket" />

  <!-- Center Framing Crosshair Markers -->
  <line x1="50" y1="140" x2="65" y2="140" stroke="#334155" stroke-width="1.5" />
  <line x1="935" y1="140" x2="950" y2="140" stroke="#334155" stroke-width="1.5" />

  <!-- Rotating Aperture Blades / Iris Reticle -->
  <g class="aperture-ring">
    <circle cx="500" cy="75" r="26" stroke="#D4A843" stroke-width="1.5" fill="none" stroke-dasharray="8 6" opacity="0.8" />
    <circle cx="500" cy="75" r="16" stroke="#818CF8" stroke-width="1" fill="none" opacity="0.6" />
    <circle cx="500" cy="75" r="5" fill="#D4A843" opacity="0.9" />
  </g>

  <!-- Animated Main Logo Header -->
  <g class="pulse-glow">
    <text x="500" y="160" class="main-title">SHUTTERSCAPE</text>
  </g>

  <!-- Subtitle Bar -->
  <text x="500" y="194" class="subtitle">Girijananda Chowdhury University · Photography Club</text>

  <!-- Clean Centered Creator Badge Bar -->
  <g>
    <rect x="315" y="215" width="370" height="34" rx="17" fill="#0b0f19" stroke="#334155" stroke-width="1" />
    <text x="500" y="237" class="creator-tag">
      Designed &amp; made with love by <tspan font-weight="bold" fill="#D4A843">Krishnayan</tspan>
    </text>
  </g>
</svg>
